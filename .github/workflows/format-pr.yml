name: Format PR (produce patch)

# Fork-safe half: runs the workflow from the PR merge commit with a read-only token.
# Only maintainers opt a PR in with the `format:apply` label. No privileged context
# is involved here — the patch is just an artifact for the applier workflow.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    name: prettier patch
    if: contains(github.event.pull_request.labels.*.name, 'format:apply')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Patch against the PR head, not the merge commit: the applier rebuilds the
          # output branch from that same head so the PR's own edits are preserved.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install
        run: npm ci
      - name: Format
        run: npm run format
      - name: Produce patch and no-change signal
        run: |
          mkdir -p "$RUNNER_TEMP/format-patch"
          git diff --binary > "$RUNNER_TEMP/format-patch/format.patch"
          if [ -s "$RUNNER_TEMP/format-patch/format.patch" ]; then
            printf 'yes\n' > "$RUNNER_TEMP/format-patch/has_changes"
          else
            printf 'no\n' > "$RUNNER_TEMP/format-patch/has_changes"
          fi
      - name: Upload patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: format-patch
          path: ${{ runner.temp }}/format-patch
          retention-days: 7
